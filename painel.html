<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>TRADE WINNER PRO · Gerador de Chaves</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090d;
      --bg2: #0f0f15;
      --surface: #13131a;
      --border: #1f1f2a;
      --border2: #2a2a38;
      --gold: #c9a84c;
      --gold2: #e8c96a;
      --text: #e8e8f0;
      --text2: #8888a8;
      --green: #3ecf8e;
      --red: #e05260;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background-color: #09090d;
      background-image: url('gettyimages.png');
      background-size: cover;
      background-position: center 20%;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    nav, .main-container, footer { position: relative; z-index: 10; }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(1rem, 2vw, 2rem);
      height: 60px;
      background: rgba(9, 9, 13, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      gap: 0.8rem;
    }

    .nav-logo {
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--gold2);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav-logo-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
      animation: blink 2s ease infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .nav-links { display: flex; align-items: center; gap: 1.2rem; list-style: none; }
    .nav-links a { font-size: .75rem; font-weight: 500; color: var(--text2); text-decoration: none; letter-spacing: .5px; transition: color .2s; }
    .nav-links a:hover { color: var(--gold2); }

    /* ⭐ BADGE DE NOTIFICAÇÃO ⭐ */
    .notif-badge {
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0 6px;
      margin-left: -8px;
      margin-top: -10px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.15)}
    }
    .notif-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-voltar {
      display: inline-flex; align-items: center; gap: .5rem;
      background: transparent; border: 1px solid var(--border2);
      color: var(--text2); font-size: .75rem; font-weight: 500;
      padding: .5rem 1rem; border-radius: 6px; text-decoration: none;
      transition: all .2s; font-family: 'DM Sans', sans-serif;
    }
    .btn-voltar:hover { border-color: var(--gold); color: var(--gold2); }

    .main-container { max-width: 900px; margin: 2rem auto; padding: 0 clamp(1rem, 3vw, 2rem); }

    .page-header { text-align: center; margin-bottom: 2.5rem; }
    .page-tag {
      display: inline-flex; align-items: center; gap: .5rem;
      background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.25);
      border-radius: 4px; padding: .35rem .9rem;
      font-family: 'DM Mono', monospace; font-size: .7rem; font-weight: 500;
      color: var(--gold2); letter-spacing: 2px; margin: 0 auto 1rem;
    }
    .page-title { font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 700; letter-spacing: -.5px; line-height: 1.2; margin-bottom: .5rem; }
    .page-title em { font-style: normal; color: var(--gold2); }
    .page-desc { color: var(--text2); font-weight: 300; font-size: .95rem; }

    .card {
      background: rgba(19, 19, 26, 0.95); border: 1px solid var(--border2);
      border-radius: 16px; padding: 2rem 1.8rem; margin-bottom: 1.5rem;
      backdrop-filter: blur(8px);
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);
    }
    .card-title { font-size: 1.1rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: .5rem; }

    /* ⭐ PAINEL DE NOTIFICAÇÕES ⭐ */
    .notificacoes-panel {
      background: rgba(19, 19, 26, 0.95);
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    .notificacoes-panel.show { display: block; }
    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: rgba(201,168,76,0.04);
      border: 1px solid var(--border);
      transition: all 0.2s;
      cursor: pointer;
    }
    .notif-item:hover { border-color: var(--gold); background: rgba(201,168,76,0.08); }
    .notif-item.nova { border-left: 3px solid var(--red); background: rgba(224,82,96,0.05); }
    .notif-icone { font-size: 1.5rem; flex-shrink: 0; }
    .notif-info { flex: 1; }
    .notif-nome { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .notif-detalhe { font-size: 0.7rem; color: var(--text2); margin-top: 2px; }
    .notif-data { font-size: 0.65rem; color: var(--text2); margin-top: 4px; }
    .notif-acoes { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .btn-notif { 
      padding: 6px 12px; 
      border-radius: 6px; 
      font-size: 0.65rem; 
      font-weight: 600; 
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-notif:hover { border-color: var(--gold); color: var(--gold2); }
    .btn-notif.whats { border-color: #25d366; color: #25d366; }
    .btn-notif.whats:hover { background: rgba(37,211,102,0.15); }
    .sem-notificacoes {
      text-align: center;
      padding: 2rem;
      color: var(--text2);
      font-size: 0.85rem;
    }

    /* ⭐ PLANOS GRID - 6 COLUNAS ⭐ */
    .planos-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 1.5rem; }
    @media (max-width:900px){.planos-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:480px){.planos-grid{grid-template-columns:repeat(2,1fr);gap:4px}}

    .plano-card {
      background: transparent; padding: .8rem .3rem; border-radius: 10px;
      text-align: center; cursor: pointer; border: 1px solid var(--border);
      transition: all 0.2s; user-select: none;
    }
    .plano-card:hover { border-color: rgba(201,168,76,0.4); background: rgba(201,168,76,0.05); }
    .plano-card.active { border-color: var(--gold); background: rgba(201,168,76,0.1); }
    .plano-icone { font-size: 1.4rem; margin-bottom: 3px; }
    .plano-nome { font-weight: 700; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }
    .plano-dias { font-size: 0.75rem; font-weight: 500; color: var(--text); margin: 1px 0; }
    .plano-valor { font-size: 0.65rem; font-weight: 600; font-family: 'DM Mono', monospace; }

    .plano-latao .plano-nome,.plano-latao .plano-valor{color:#CD7F32}
    .plano-latao.active{border-color:#CD7F32;background:rgba(205,127,50,0.15)}
    .plano-bronze .plano-nome,.plano-bronze .plano-valor{color:#8B6914}
    .plano-bronze.active{border-color:#8B6914;background:rgba(139,105,20,0.1)}
    .plano-prata .plano-nome,.plano-prata .plano-valor{color:#7D8794}
    .plano-prata.active{border-color:#7D8794;background:rgba(125,135,148,0.1)}
    .plano-ouro .plano-nome,.plano-ouro .plano-valor{color:#DAA520}
    .plano-ouro.active{border-color:#DAA520;background:rgba(218,165,32,0.1)}
    .plano-diamante .plano-nome,.plano-diamante .plano-valor{color:#6A5ACD}
    .plano-diamante.active{border-color:#6A5ACD;background:rgba(106,90,205,0.1)}
    .plano-elite .plano-nome,.plano-elite .plano-valor{color:#C0392B}
    .plano-elite.active{border-color:#C0392B;background:rgba(192,57,43,0.1)}

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-bottom: .8rem; }
    @media(max-width:560px){.form-row{grid-template-columns:1fr}}
    .fg { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .9rem; }
    .fg label { font-size: .78rem; font-weight: 500; color: var(--text2); }
    .fg input,.fg select,.fg textarea {
      background: rgba(9,9,13,0.8); border: 1px solid var(--border2);
      border-radius: 8px; color: var(--text); padding: .65rem .9rem;
      font-family: 'DM Sans', sans-serif; font-size: .9rem; width: 100%;
      transition: border-color .2s;
    }
    .fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gold)}
    .fg input::placeholder{color:#555}
    .fg textarea{resize:vertical;min-height:80px}
    .input-group{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
    @media(max-width:560px){.input-group{grid-template-columns:1fr}}
    .data-box{background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.1);border-radius:8px;padding:.8rem 1rem;margin-bottom:.9rem}
    .data-box-label{font-size:.7rem;color:var(--gold);font-family:'DM Mono',monospace;letter-spacing:1px;margin-bottom:.4rem}

    .btn-primary {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--gold); color: #09090d; font-weight: 700;
      font-size: .9rem; padding: .75rem 1.8rem; border-radius: 6px;
      text-decoration: none; letter-spacing: .3px; transition: all .2s;
      border: none; cursor: pointer; font-family: 'DM Sans', sans-serif;
      width: 100%; justify-content: center;
    }
    .btn-primary:hover { background: var(--gold2); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(201,168,76,0.3); }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: .5rem;
      background: transparent; border: 1px solid var(--border2);
      color: var(--text2); font-size: .85rem; font-weight: 500;
      padding: .7rem 1.5rem; border-radius: 6px; text-decoration: none;
      transition: all .2s; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold2); background: rgba(201,168,76,.05); }
    .btn-ghost.active { border-color: var(--gold); color: var(--gold2); background: rgba(201,168,76,0.1); }

    .btn-whats-chave{background:transparent;border:1px solid var(--gold);color:var(--gold)}
    .btn-whats-chave:hover{background:rgba(201,168,76,0.15);border-color:var(--gold2);color:var(--gold2)}
    .btn-whats-cobranca{background:transparent;border:1px solid #25d366;color:#25d366}
    .btn-whats-cobranca:hover{background:rgba(37,211,102,0.15)}
    .btn-whats-teste{background:transparent;border:1px solid #3498db;color:#3498db}
    .btn-whats-teste:hover{background:rgba(52,152,219,0.15)}
    .btn-whats-outro{background:transparent;border:1px solid #9b59b6;color:#9b59b6}
    .btn-whats-outro:hover{background:rgba(155,89,182,0.15)}

    .chave-box {
      background: rgba(201,168,76,0.06); border: 2px solid var(--gold);
      border-radius: 12px; padding: 1.5rem; text-align: center;
      margin-top: 1.5rem; display: none;
    }
    .chave-box.show { display: block; animation: fadeInUp 0.4s ease; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .chave-label { font-family: 'DM Mono', monospace; font-size: .65rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: .5rem; }
    .chave-valor { font-family: 'DM Mono', monospace; font-size: 1.1rem; font-weight: 500; color: var(--gold2); letter-spacing: 1px; word-break: break-all; margin-bottom: .5rem; }
    
    .badge-plano { display: inline-block; padding: .25rem .8rem; border-radius: 20px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1rem; }
    .badge-latao{background:#CD7F32;color:#FFF5E0}
    .badge-bronze{background:#8B6914;color:#FFF5E0}
    .badge-prata{background:#7D8794;color:#FFF}
    .badge-ouro{background:#DAA520;color:#1a1a1a}
    .badge-diamante{background:#6A5ACD;color:#FFF}
    .badge-elite{background:#C0392B;color:#FFF}

    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th { text-align: left; padding: 12px 10px; color: var(--gold); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; background: rgba(19, 19, 26, 0.95); border-bottom: 2px solid var(--gold); font-family: 'DM Mono', monospace; position: sticky; top: 0; }
    td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.8rem; vertical-align: middle; }
    tr:hover td { background: rgba(201,168,76,0.03); }
    .client-name { font-weight: 600; color: var(--text); }
    .client-detail { font-size: 0.68rem; color: var(--text2); }
    .chave-display { background: rgba(201,168,76,0.08); padding: 4px 8px; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--gold2); border: 1px solid rgba(201,168,76,0.2); display: inline-block; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-ativo{background:rgba(62,207,142,0.15);color:var(--green)}
    .status-vencendo{background:rgba(201,168,76,0.15);color:var(--gold)}
    .status-vencido{background:rgba(224,82,96,0.15);color:var(--red)}
    .action-btns{display:flex;gap:4px;flex-wrap:wrap}
    .btn-icon { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; background: transparent; }
    .btn-icon:hover{transform:translateY(-2px)}
    .btn-icon-chave{border-color:var(--gold);color:var(--gold)}
    .btn-icon-chave:hover{background:rgba(201,168,76,0.15)}
    .btn-icon-whats{border-color:#25d366;color:#25d366}
    .btn-icon-whats:hover{background:rgba(37,211,102,0.15)}
    .btn-icon-delete{border-color:var(--red);color:var(--red)}
    .btn-icon-delete:hover{background:rgba(224,82,96,0.15)}

    .status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
    @media(max-width:600px){.status-grid{grid-template-columns:repeat(2,1fr)}}
    .status-card { background: rgba(19, 19, 26, 0.9); border: 1px solid var(--border); border-radius: 12px; padding: 1rem .8rem; text-align: center; cursor: pointer; transition: all .2s; }
    .status-card:hover{border-color:rgba(201,168,76,0.3);transform:translateY(-2px)}
    .status-card.active{border-color:var(--gold);background:rgba(201,168,76,0.1)}
    .status-number{display:block;font-family:'DM Mono',monospace;font-size:1.8rem;font-weight:500;color:var(--gold2)}
    .status-label{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
    .status-number.green{color:var(--green)}
    .status-number.red{color:var(--red)}

    .finance-box { background: rgba(19, 19, 26, 0.9); border: 1px solid var(--border2); border-left: 4px solid var(--gold); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .finance-total { font-family: 'DM Mono', monospace; font-size: 2rem; font-weight: 500; color: #fff; margin: .3rem 0; }
    .botoes-whatsapp { display: flex; gap: 8px; margin-top: 1rem; flex-wrap: wrap; }
    .botoes-whatsapp button { flex: 1; min-width: 100px; padding: .6rem; font-size: .75rem; font-weight: 600; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 200; }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 201; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 2rem; }
    .modal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--gold2); }
    .preco-config-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .preco-config-row label { min-width: 180px; font-size: .85rem; }
    .preco-config-row input { width: 120px; }
    .report-option { background: rgba(13,13,20,0.8); padding: 20px; border-radius: 16px; cursor: pointer; text-align: center; border: 1px solid var(--border); transition: all .2s; }
    .report-option:hover { border-color: var(--gold); background: rgba(201,168,76,0.05); }
    .report-option h4 { margin-top: 10px; font-size: .9rem; }

    footer { border-top: 1px solid var(--border); background: rgba(10, 10, 16, 0.95); padding: 2rem clamp(1.5rem,6vw,5rem) 1rem; text-align: center; margin-top: 3rem; }
    footer p { font-size: .7rem; color: var(--text2); }
    hr { margin: 20px 0; border-color: var(--border); }

    @media(max-width:600px){
      nav{flex-wrap:wrap;height:auto;padding:.5rem 1rem}
      .nav-logo{font-size:.75rem}
      .card{padding:1.2rem 1rem}
      .chave-valor{font-size:.85rem}
      .botoes-whatsapp button{flex:1 1 45%;min-width:80px}
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo"><span class="nav-logo-dot"></span>TRADE WINNER PRO</div>
  <ul class="nav-links">
    <li><a href="index.html">🏠 Início</a></li>
    <li><a href="#gerador">Gerador</a></li>
    <li><a href="#clientes">Clientes</a></li>
    <!-- ⭐ LINK NOTIFICAÇÕES ⭐ -->
    <li class="notif-link">
      <a href="#notificacoes" onclick="mostrarNotificacoes()">🔔</a>
      <span class="notif-badge" id="notifContador">0</span>
    </li>
  </ul>
  <a href="index.html" class="btn-voltar">← Voltar ao Site</a>
</nav>

<div class="main-container">
  <div class="page-header" id="gerador">
    <div class="page-tag"><span class="nav-logo-dot"></span>LICENSE MANAGER V7.91</div>
    <h1 class="page-title">Gerador de <em>Chaves</em></h1>
    <p class="page-desc">Cadastre clientes e gere licenças para o MetaTrader 5</p>
  </div>

  <!-- ⭐ PAINEL DE NOTIFICAÇÕES ⭐ -->
  <div class="notificacoes-panel" id="painelNotificacoes">
    <div class="card-header">
      <span class="card-title">🔔 Últimos Cadastros</span>
      <button class="btn-ghost" style="width:auto;padding:.3rem .8rem;font-size:.7rem" onclick="marcarTodasLidas()">✓ MARCAR TUDO LIDO</button>
    </div>
    <div id="listaNotificacoes">
      <div class="sem-notificacoes">Nenhum cadastro recente</div>
    </div>
  </div>

  <!-- ══ CARD: GERAR CHAVE ══ -->
  <div class="card">
    <div class="card-header"><span class="card-title">🔐 Nova Licença</span></div>
    <div class="form-row">
      <div class="fg"><label>Nome Completo *</label><input type="text" id="nomeInput" placeholder="Nome do cliente"></div>
      <div class="fg"><label>WhatsApp *</label><input type="tel" id="whatsInput" placeholder="+55 41 99999-9999"></div>
    </div>
    
    <label style="font-size:.78rem;font-weight:500;color:var(--text2);margin-bottom:.5rem;display:block">Plano *</label>
    <div class="planos-grid" id="planosGrid">
      <div class="plano-card plano-latao active" data-plano="LATAO" data-dias="7" data-valor="0" onclick="selecionarPlano('LATAO',7,0,this)">
        <div class="plano-icone">🔰</div><div class="plano-nome">Latão</div><div class="plano-dias">7 dias</div><div class="plano-valor">GRÁTIS</div>
      </div>
      <div class="plano-card plano-bronze" data-plano="BRONZE" data-dias="30" data-valor="49.90" onclick="selecionarPlano('BRONZE',30,49.90,this)">
